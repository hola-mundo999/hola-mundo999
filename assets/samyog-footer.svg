<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 84" width="100%" height="auto" role="img" aria-label="Footer: open to collaboration, always shipping">
  <title>Open to collaboration · always shipping</title>
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f19" />
      <stop offset="50%" stop-color="#0d1524" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="footerEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="footerSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="footerClip"><rect width="880" height="84" rx="14" /></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    @keyframes sweep {
      0%        { transform: translateX(0); }
      55%, 100% { transform: translateX(1000px); }
    }
    @keyframes flow {
      to { stroke-dashoffset: -240; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }
    .dot { animation: pulseDot 2.4s ease-in-out infinite; }
    .sweep { animation: sweep 10s cubic-bezier(0.3, 0, 0.2, 1) 1s infinite; }
    .flow { animation: flow 7s linear infinite; }
    .shimmer { animation: shimmer 5s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .dot, .sweep, .flow, .shimmer { animation: none !important; }
    }
  </style>

  <rect width="880" height="84" rx="14" fill="url(#footerBg)" />
  <g clip-path="url(#footerClip)">
    <rect class="sweep" x="-220" y="-20" width="170" height="140" fill="url(#footerSweep)" transform="skewX(-18)" />
  </g>
  <rect x="0.6" y="0.6" width="878.8" height="82.8" rx="13.4" fill="none" stroke="url(#footerBorder)" stroke-width="1" />
  <line x1="24" y1="1" x2="856" y2="1" stroke="url(#footerBorder)" stroke-width="1" opacity="0.7" />

  <!-- left: availability -->
  <circle class="dot" cx="42" cy="32" r="3.4" fill="#34d399" />
  <circle cx="42" cy="32" r="3.4" fill="none" stroke="#34d399" stroke-width="1">
    <animate attributeName="r" values="3.4;9" dur="2.6s" begin="0s" repeatCount="indefinite" />
    <animate attributeName="stroke-opacity" values="0.5;0" dur="2.6s" begin="0s" repeatCount="indefinite" />
  </circle>
  <text x="58" y="36" fill="#6ee7b7" font-size="10.5" font-weight="700" letter-spacing="1.2" class="mono">OPEN TO COLLABORATION</text>
  <text x="58" y="52" fill="#64748b" font-size="9.5" letter-spacing="0.4" class="mono">building in public · shipping every week</text>

  <!-- center: signature -->
  <text x="440" y="36" fill="#94a3b8" font-size="11.5" text-anchor="middle" letter-spacing="0.4" class="mono">Engineered with curiosity &amp; precision</text>
  <text x="440" y="52" fill="#475569" font-size="9.5" text-anchor="middle" letter-spacing="1.6" class="mono">FASTAPI · REACT · OPENCV · LLM SYSTEMS</text>

  <!-- right: equalizer + status -->
  <g fill="#38bdf8">
    <rect x="704" y="46" width="4" height="10" rx="2"><animate attributeName="height" values="10;20;7;16;10" dur="1.9s" repeatCount="indefinite" /><animate attributeName="y" values="46;36;49;40;46" dur="1.9s" repeatCount="indefinite" /></rect>
    <rect x="714" y="38" width="4" height="18" rx="2" fill="#22d3ee"><animate attributeName="height" values="18;8;21;11;18" dur="1.7s" begin="0.2s" repeatCount="indefinite" /><animate attributeName="y" values="38;48;35;45;38" dur="1.7s" begin="0.2s" repeatCount="indefinite" /></rect>
    <rect x="724" y="42" width="4" height="14" rx="2" fill="#818cf8"><animate attributeName="height" values="14;22;9;18;14" dur="2.1s" begin="0.4s" repeatCount="indefinite" /><animate attributeName="y" values="42;34;47;38;42" dur="2.1s" begin="0.4s" repeatCount="indefinite" /></rect>
    <rect x="734" y="34" width="4" height="22" rx="2" fill="#34d399"><animate attributeName="height" values="22;10;19;13;22" dur="1.8s" begin="0.6s" repeatCount="indefinite" /><animate attributeName="y" values="34;46;37;43;34" dur="1.8s" begin="0.6s" repeatCount="indefinite" /></rect>
    <rect x="744" y="44" width="4" height="12" rx="2" fill="#38bdf8"><animate attributeName="height" values="12;19;8;15;12" dur="2s" begin="0.8s" repeatCount="indefinite" /><animate attributeName="y" values="44;37;48;41;44" dur="2s" begin="0.8s" repeatCount="indefinite" /></rect>
  </g>
  <text x="856" y="36" fill="#7dd3fc" font-size="10" text-anchor="end" letter-spacing="1.4" class="mono">ALWAYS SHIPPING</text>
  <text x="856" y="52" fill="#475569" font-size="9" text-anchor="end" letter-spacing="1.2" class="mono">BUILD · SHIP · REPEAT</text>

  <!-- flowing bottom edge -->
  <line class="flow" x1="40" y1="74" x2="840" y2="74" stroke="url(#footerEdge)" stroke-width="1.5" stroke-dasharray="5 16" />
  <circle class="shimmer" cx="440" cy="74" r="2" fill="#a5f3fc" />
</svg>
