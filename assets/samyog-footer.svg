<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 70" width="100%" height="auto">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .footer-text {
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, monospace;
      font-size: 11.5px;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Base -->
  <rect width="880" height="70" rx="12" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1" />

  <!-- Connecting Nodes Line -->
  <line x1="40" y1="35" x2="260" y2="35" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" />
  <line x1="620" y1="35" x2="840" y2="35" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" />

  <!-- Center Content -->
  <g transform="translate(440, 39)">
    <circle cx="-160" cy="-4" r="3" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text text-anchor="middle" class="footer-text">
      Engineered with curiosity &amp; precision · Always learning, building &amp; shipping.
    </text>
    <circle cx="160" cy="-4" r="3" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
