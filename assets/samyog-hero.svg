<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="indigoOrb" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanOrb" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes scanline {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-font { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", Menlo, monospace; }
    .sans-font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .scan-path {
      stroke-dasharray: 8 16;
      animation: scanline 6s linear infinite;
    }
    .cursor {
      animation: blinkCursor 1s infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="880" height="260" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <rect width="880" height="260" rx="16" fill="url(#indigoOrb)" />
  <rect width="880" height="260" rx="16" fill="url(#cyanOrb)" />

  <!-- Subtle Cyber Grid -->
  <rect width="880" height="260" rx="16" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="878" height="258" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Animated Circuit / Cyber Lines -->
  <path d="M 24 210 L 260 210 L 300 240 L 700 240 L 740 210 L 856 210" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" class="scan-path" />
  <path d="M 120 18 L 80 50 L 24 50" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" class="scan-path" />
  <path d="M 760 18 L 800 50 L 856 50" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.3" class="scan-path" />

  <!-- Terminal Top Bar -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="16" cy="0" r="5" fill="#f59e0b" />
    <circle cx="32" cy="0" r="5" fill="#10b981" />
    <text x="54" y="4" fill="#94a3b8" font-size="12" class="term-font">samyog@universe:~$ whoami --verbose</text>
  </g>

  <!-- Live Pulse Status Indicator -->
  <g transform="translate(730, 28)">
    <circle cx="0" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="14" y="4" fill="#6ee7b7" font-size="11" class="term-font" font-weight="600">ONLINE · EXPLORING</text>
  </g>

  <!-- Glowing Underline Behind Title -->
  <rect x="32" y="128" width="816" height="1.5" fill="url(#lineGrad)" />

  <!-- Main Name Header -->
  <g transform="translate(32, 102)">
    <text fill="url(#nameGrad)" font-size="44" font-weight="800" class="sans-font" letter-spacing="1.5">SAMYOG SAPKOTA</text>
    <text x="496" y="-8" fill="#38bdf8" font-size="28" class="cursor">_</text>
  </g>

  <!-- Subtitle Line -->
  <g transform="translate(32, 154)">
    <text fill="#f1f5f9" font-size="16" font-weight="600" class="sans-font" letter-spacing="0.3">
      Software Developer
      <tspan fill="#64748b" font-weight="400"> ╱ </tspan>
      <tspan fill="#38bdf8">Applied AI &amp; Computer Vision</tspan>
      <tspan fill="#64748b" font-weight="400"> ╱ </tspan>
      <tspan fill="#a5b4fc">BSc CSIT @ Prime College</tspan>
    </text>
  </g>

  <!-- Tag Pills -->
  <g transform="translate(32, 184)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="176" height="26" rx="6" fill="#1e1b4b" fill-opacity="0.8" stroke="#4f46e5" stroke-width="0.8" />
    <text x="88" y="17" fill="#c7d2fe" font-size="11.5" font-weight="600" class="sans-font" text-anchor="middle">🎓 TU BSc CSIT (Class '27)</text>

    <!-- Pill 2 -->
    <rect x="186" y="0" width="186" height="26" rx="6" fill="#0c4a6e" fill-opacity="0.8" stroke="#0284c7" stroke-width="0.8" />
    <text x="279" y="17" fill="#bae6fd" font-size="11.5" font-weight="600" class="sans-font" text-anchor="middle">🚀 PR Advisor @ Prime IT Club</text>

    <!-- Pill 3 -->
    <rect x="382" y="0" width="178" height="26" rx="6" fill="#064e3b" fill-opacity="0.8" stroke="#059669" stroke-width="0.8" />
    <text x="471" y="17" fill="#a7f3d0" font-size="11.5" font-weight="600" class="sans-font" text-anchor="middle">⚡ Full-Stack &amp; AI Systems</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="148" height="26" rx="6" fill="#18181b" fill-opacity="0.9" stroke="#3f3f46" stroke-width="0.8" />
    <text x="644" y="17" fill="#e4e4e7" font-size="11.5" font-weight="600" class="sans-font" text-anchor="middle">📍 Kathmandu, Nepal</text>
  </g>
</svg>
