<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="auto" role="img" aria-label="Samyog Sapkota — Software Developer, Applied AI and Computer Vision">
  <title>Samyog Sapkota — Software Developer, Applied AI &amp; Computer Vision</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="48%" stop-color="#070b13" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <radialGradient id="orbIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#334155" stroke-width="0.55" stroke-opacity="0.34" />
      <circle cx="0" cy="0" r="1.1" fill="#38bdf8" fill-opacity="0.30" />
    </pattern>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0e7ff" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.62" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="25%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.62" />
      <stop offset="55%" stop-color="#bae6fd" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#bfdbfe" stop-opacity="0.055" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.92" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect width="880" height="290" rx="18" />
    </clipPath>

    <mask id="nameMask" maskUnits="userSpaceOnUse" x="0" y="0" width="880" height="290">
      <text x="40" y="106" fill="#ffffff" font-size="46" font-weight="800"
            letter-spacing="1.5"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">SAMYOG SAPKOTA</text>
    </mask>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", Menlo, Consolas, monospace; }

    @keyframes driftA {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(26px, -18px) scale(1.08); }
    }
    @keyframes driftB {
      0%, 100% { transform: translate(0, 0) scale(1.04); }
      50%      { transform: translate(-30px, 16px) scale(0.96); }
    }
    @keyframes driftC {
      0%, 100% { transform: translate(0, 0) scale(0.98); opacity: 0.75; }
      50%      { transform: translate(14px, 10px) scale(1.1); opacity: 1; }
    }
    @keyframes gridDrift {
      from { transform: translate(0, 0); }
      to   { transform: translate(36px, 36px); }
    }
    @keyframes scan {
      0%   { transform: translateY(-12px); opacity: 0; }
      12%  { opacity: 0.55; }
      88%  { opacity: 0.55; }
      100% { transform: translateY(298px); opacity: 0; }
    }
    @keyframes sweep {
      0%        { transform: translateX(0); }
      48%, 100% { transform: translateX(1360px); }
    }
    @keyframes shimmer {
      0%        { transform: translateX(0); }
      46%, 100% { transform: translateX(1180px); }
    }
    @keyframes blinkCursor {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }
    @keyframes ringOut {
      0%   { r: 3; opacity: 0.55; }
      100% { r: 12; opacity: 0; }
    }
    @keyframes railFlow {
      to { stroke-dashoffset: -170; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    @keyframes bracket {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.8; }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    .orb { transform-box: fill-box; transform-origin: center; }
    .orb-a { animation: driftA 24s ease-in-out infinite; }
    .orb-b { animation: driftB 31s ease-in-out infinite; }
    .orb-c { animation: driftC 19s ease-in-out infinite; }
    .grid { animation: gridDrift 34s linear infinite; }
    .scan { animation: scan 9s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .sweep { animation: sweep 12s cubic-bezier(0.3, 0, 0.2, 1) 1.5s infinite; }
    .shimmer { animation: shimmer 7.5s cubic-bezier(0.4, 0, 0.2, 1) 1s infinite; }
    .cursor { animation: blinkCursor 1.1s steps(1, end) infinite; }
    .dot { animation: pulseDot 2.2s ease-in-out infinite; }
    .rail { animation: railFlow 5.5s linear infinite; }
    .pill { animation: floatPill 7s ease-in-out infinite; }
    .bracket { animation: bracket 6s ease-in-out infinite; }
    .node { animation: nodePulse 3.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .orb, .grid, .scan, .sweep, .shimmer, .cursor, .dot, .rail, .pill, .bracket, .node {
        animation: none !important;
      }
    }
  </style>

  <!-- base -->
  <rect width="880" height="290" rx="18" fill="url(#bgGrad)" />

  <g clip-path="url(#cardClip)">
    <!-- ambient aurora -->
    <ellipse class="orb orb-a" cx="170" cy="40" rx="330" ry="210" fill="url(#orbIndigo)" />
    <ellipse class="orb orb-b" cx="770" cy="250" rx="310" ry="200" fill="url(#orbCyan)" />
    <ellipse class="orb orb-c" cx="520" cy="10" rx="260" ry="150" fill="url(#orbEmerald)" />

    <!-- drifting cyber grid -->
    <g class="grid">
      <rect x="-36" y="-36" width="952" height="362" fill="url(#grid)" />
    </g>

    <!-- light sweep + CRT scanline -->
    <g transform="skewX(-18)">
      <rect class="sweep" x="-220" y="-60" width="150" height="420" fill="url(#sweepGrad)" />
    </g>
    <rect class="scan" x="0" y="0" width="880" height="1.4" fill="url(#lineGrad)" opacity="0.4" />
  </g>

  <!-- frame -->
  <rect x="1" y="1" width="878" height="288" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- corner brackets -->
  <g class="bracket" stroke="#38bdf8" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M 30 18 H 62 M 18 30 V 62" stroke="#818cf8" />
    <path d="M 850 18 H 818 M 862 30 V 62" stroke="#22d3ee" />
    <path d="M 30 272 H 62 M 18 260 V 228" stroke="#22d3ee" />
    <path d="M 850 272 H 818 M 862 260 V 228" stroke="#34d399" />
  </g>

  <!-- terminal chrome -->
  <g transform="translate(42, 32)">
    <circle cx="0" cy="0" r="5" fill="#ef4444" />
    <circle cx="17" cy="0" r="5" fill="#f59e0b" />
    <circle cx="34" cy="0" r="5" fill="#10b981" />
    <text x="56" y="4" fill="#94a3b8" font-size="12" class="mono">samyog@universe:~$ whoami --verbose</text>
  </g>

  <g transform="translate(838, 32)">
    <circle class="dot" cx="-104" cy="0" r="4" fill="#10b981" />
    <circle cx="-104" cy="0" r="4" fill="none" stroke="#10b981" stroke-width="1">
      <animate attributeName="r" values="4;11" dur="2.6s" begin="0s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.55;0" dur="2.6s" begin="0s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="4" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="end" letter-spacing="0.8" class="mono">ONLINE · EXPLORING</text>
  </g>

  <line x1="42" y1="52" x2="838" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- name with travelling highlight -->
  <text x="40" y="106" fill="url(#nameGrad)" font-size="46" font-weight="800" letter-spacing="1.5" class="sans">SAMYOG SAPKOTA<tspan class="cursor" fill="#38bdf8">_</tspan></text>
  <g mask="url(#nameMask)">
    <rect class="shimmer" x="-280" y="60" width="190" height="70" fill="url(#shineGrad)" />
  </g>

  <!-- role line -->
  <g transform="translate(42, 142)">
    <text fill="#f1f5f9" font-size="15.5" font-weight="600" class="sans" letter-spacing="0.2">
      Software Developer
      <tspan fill="#475569" font-weight="400"> ╱ </tspan>
      <tspan fill="#38bdf8">Applied AI &amp; Computer Vision</tspan>
      <tspan fill="#475569" font-weight="400"> ╱ </tspan>
      <tspan fill="#a5b4fc">BSc CSIT @ Prime College</tspan>
    </text>
  </g>

  <!-- telemetry rail -->
  <g transform="translate(40, 172)">
    <line x1="0" y1="0" x2="760" y2="0" stroke="#1e293b" stroke-width="1" />
    <line class="rail" x1="0" y1="0" x2="760" y2="0" stroke="url(#railGrad)" stroke-width="1.6" stroke-dasharray="4 15" />
    <g font-size="8.5" letter-spacing="1.5" class="mono" fill="#526079" text-anchor="middle">
      <g class="node" style="animation-delay:0s"><circle cx="40" cy="0" r="2.6" fill="#38bdf8" /><text x="40" y="18">PYTHON</text></g>
      <g class="node" style="animation-delay:0.5s"><circle cx="210" cy="0" r="2.6" fill="#818cf8" /><text x="210" y="18">FASTAPI</text></g>
      <g class="node" style="animation-delay:1s"><circle cx="380" cy="0" r="2.6" fill="#22d3ee" /><text x="380" y="18">REACT 19</text></g>
      <g class="node" style="animation-delay:1.5s"><circle cx="550" cy="0" r="2.6" fill="#34d399" /><text x="550" y="18">THREE.JS</text></g>
      <g class="node" style="animation-delay:2s"><circle cx="720" cy="0" r="2.6" fill="#a5b4fc" /><text x="720" y="18">OPENCV</text></g>
    </g>
  </g>

  <!-- tag pills -->
  <g transform="translate(60, 208)" font-size="11.5" font-weight="600" class="sans">
    <g class="pill" style="animation-delay:0s">
      <rect width="180" height="28" rx="7" fill="#1e1b4b" fill-opacity="0.82" stroke="#4f46e5" stroke-width="0.9" />
      <text x="90" y="18.5" fill="#c7d2fe" text-anchor="middle">🎓 TU BSc CSIT (Class '27)</text>
    </g>
    <g class="pill" style="animation-delay:0.7s">
      <rect x="192" width="196" height="28" rx="7" fill="#0c4a6e" fill-opacity="0.82" stroke="#0284c7" stroke-width="0.9" />
      <text x="290" y="18.5" fill="#bae6fd" text-anchor="middle">🚀 PR Advisor @ Prime IT Club</text>
    </g>
    <g class="pill" style="animation-delay:1.4s">
      <rect x="400" width="182" height="28" rx="7" fill="#064e3b" fill-opacity="0.82" stroke="#059669" stroke-width="0.9" />
      <text x="491" y="18.5" fill="#a7f3d0" text-anchor="middle">⚡ Full-Stack &amp; AI Systems</text>
    </g>
    <g class="pill" style="animation-delay:2.1s">
      <rect x="594" width="166" height="28" rx="7" fill="#111827" fill-opacity="0.9" stroke="#3f3f46" stroke-width="0.9" />
      <text x="677" y="18.5" fill="#e4e4e7" text-anchor="middle">📍 Kathmandu, Nepal</text>
    </g>
  </g>

  <!-- footer signal -->
  <line x1="42" y1="258" x2="838" y2="258" stroke="url(#lineGrad)" stroke-width="1" opacity="0.55" />
  <text x="42" y="278" fill="#64748b" font-size="10.5" letter-spacing="0.6" class="mono">samyog@github ~ $ deploy --live --region=auto</text>
  <circle class="dot" cx="694" cy="274" r="3" fill="#34d399" style="animation-delay:0.4s" />
  <text x="838" y="278" fill="#5eead4" font-size="10.5" letter-spacing="1.4" text-anchor="end" class="mono">BUILD · SHIP · LEARN</text>
</svg>
