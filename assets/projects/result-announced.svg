<svg xmlns="http://www.w3.org/2000/svg" width="440" height="178" viewBox="0 0 440 178" role="img" aria-labelledby="t4581096 d4581096">
<title id="t4581096">Result Announced: live at result-card-generator-red.vercel.app</title>
<desc id="d4581096">Turns TU board marks into a printable, shareable result card with grades, GPA and percentage.</desc>
<defs>
  <linearGradient id="bg4581096" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#080d17"/><stop offset="1" stop-color="#05080f"/>
  </linearGradient>
  <linearGradient id="edge4581096" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fbbf24" stop-opacity="0.55"/>
    <stop offset="0.45" stop-color="#243044" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#b45309" stop-opacity="0.35"/>
  </linearGradient>
  <radialGradient id="aura4581096" cx="0.5" cy="0.5" r="0.5">
