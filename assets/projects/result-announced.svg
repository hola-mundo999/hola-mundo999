    <stop offset="0.65" stop-color="#fbbf24" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bar4581096" x1="0" y1="0" x2="1" y2="0">
