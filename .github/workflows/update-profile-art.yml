name: Refresh GitHub activity visuals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contribution-render dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public contribution history
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: "hola-mundo999"

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render contribution statistics and streak
        run: python scripts/render_stats_svg.py

      - name: Commit only changed activity assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub activity visuals [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
