name: Refresh GitHub activity visuals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile-art.yml"
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - "scripts/render_stats_svg.py"
      - "scripts/requirements.txt"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install contribution-render dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public contribution history
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: "hola-mundo999"

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render contribution statistics and streak
        run: python scripts/render_stats_svg.py

      - name: Commit and push activity assets safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hola-mundo999"
          git config user.email "296933633+hola-mundo999@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg stats.svg

          if git diff --cached --quiet; then
            echo "Activity visuals are already current."
            exit 0
          fi

          git commit -m "chore: refresh GitHub activity visuals [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Activity visuals pushed successfully."
              exit 0
            fi
            echo "Push raced with another profile update; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done

          echo "Could not push activity visuals after three attempts."
          exit 1
