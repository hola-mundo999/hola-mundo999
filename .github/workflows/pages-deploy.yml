name: Deploy Contribution Explorer

on:
  schedule:
    - cron: "57 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'contribution-explorer/**'
      - '.github/workflows/pages-deploy.yml'
      - 'scripts/fetch_contributions.py'
      - 'scripts/requirements.txt'

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: "hola-mundo999"

      - name: Extract days array for explorer
        run: |
          mkdir -p contribution-explorer/data
          python3 -c "import json; d=json.load(open('data/contributions.json')); json.dump(d['days'], open('contribution-explorer/data/contributions.json', 'w'), indent=2)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./contribution-explorer

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4