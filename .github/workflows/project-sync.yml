name: Refresh public projects in profile

on:
  schedule:
    - cron: "9 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "README.md"
      - "scripts/update-profile-projects.py"
      - ".github/workflows/project-sync.yml"

permissions:
  contents: write

concurrency:
  group: profile-project-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update public repository list
        run: python3 scripts/update-profile-projects.py

      - name: Commit and push the README update safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hola-mundo999"
          git config user.email "296933633+hola-mundo999@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "Project list is already current."
            exit 0
          fi

          git commit -m "chore(profile): refresh public project list [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Updated public repository list."
              exit 0
            fi
            echo "Push raced with another profile update; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done

          echo "Could not update the public project list after three attempts."
          exit 1
