name: Generate contribution snake

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate contribution snake SVG and GIF
        uses: Platane/snk@651a2bcd85e37cf42a9f4921aca57af42f731728
        with:
          github_user_name: hola-mundo999
          outputs: |
            github-contribution-snake.svg
            github-contribution-snake-dark.svg?palette=github-dark
            github-contribution-snake.gif?color_snake=%2338bdf8&color_dots=%230b1b2b,%23153e67,%231d65a6,%2338bdf8,%23a5f3fc

      - name: Commit generated snake images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution snake [skip ci]"
          file_pattern: "github-contribution-snake.svg github-contribution-snake-dark.svg github-contribution-snake.gif"
