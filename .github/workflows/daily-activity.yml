name: Daily Activity Heartbeat

# Maintains GitHub contribution streak with one qualifying commit per UTC calendar day.
# Runs 4x daily but only creates one heartbeat commit per day.
# The commit is attributed to the profile owner's verified email.

on:
  schedule:
    - cron: "47 */6 * * *"   # 00:47, 06:47, 12:47, 18:47 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

env:
  PROFILE_COMMIT_NAME: "hola-mundo999"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check for missing email secret
        run: |
          if [ -z "${{ secrets.PROFILE_COMMIT_EMAIL }}" ]; then
            echo "::error::PROFILE_COMMIT_EMAIL secret is not configured"
            echo "Add your verified GitHub noreply email at: Settings -> Emails -> 'Add email to Git'"
            exit 1
          fi
        shell: bash

      - name: Fetch latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Check if heartbeat needed for today
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          if [ -f data/daily-activity.json ]; then
            LAST_SUCCESS=$(python3 -c "import json; print(json.load(open('data/daily-activity.json'))['last_successful_utc_date'])")
          else
            LAST_SUCCESS=""
          fi

          echo "Today: $TODAY"
          echo "Last successful: $LAST_SUCCESS"

          if [ "$LAST_SUCCESS" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "action=skipped" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "action=proceeding" >> $GITHUB_OUTPUT
          fi

      - name: Update heartbeat file
        if: steps.check.outputs.skip == 'false'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p data
          cat > data/daily-activity.json << EOF
          {
            "last_successful_utc_date": "$TODAY",
            "purpose": "Automated daily profile maintenance heartbeat"
          }
          EOF
          echo "Updated daily-activity.json to $TODAY"

      - name: Validate JSON
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 -c "import json; json.load(open('data/daily-activity.json'))"
          echo "JSON validation passed"

      - name: Configure Git identity
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "${{ env.PROFILE_COMMIT_NAME }}"
          git config user.email "${{ secrets.PROFILE_COMMIT_EMAIL }}"

      - name: Commit heartbeat
        if: steps.check.outputs.skip == 'false'
        run: |
          git add data/daily-activity.json
          git commit -m "chore(profile): automated daily activity heartbeat [skip ci]"

      - name: Push heartbeat commit
        if: steps.check.outputs.skip == 'false'
        run: |
          git push origin main

      - name: Report result
        if: steps.check.outputs.skip == 'false'
        run: |
          echo "Successfully created daily heartbeat commit"
          TODAY=$(date -u +%Y-%m-%d)
          echo "Heartbeat date: $TODAY"

      - name: Already has today's heartbeat
        if: steps.check.outputs.skip == 'true'
        run: |
          echo "Already have a daily heartbeat for today - skipping commit"
          echo "This is expected behavior for scheduled runs that find existing heartbeat"