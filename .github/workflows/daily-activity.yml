name: Daily Activity Heartbeat

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required email secret
        env:
          PROFILE_COMMIT_EMAIL: ${{ secrets.PROFILE_COMMIT_EMAIL }}
        run: |
          if [ -z "$PROFILE_COMMIT_EMAIL" ]; then
            echo "::error::PROFILE_COMMIT_EMAIL secret is not configured"
            exit 1
          fi

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Check UTC date
        id: check
        run: |
          today="$(date -u +%F)"
          last="$(python3 -c "import json; print(json.load(open('data/daily-activity.json')).get('last_successful_utc_date',''))")"
          echo "today=$today"
          echo "last=$last"
          if [ "$today" = "$last" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update heartbeat date
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 - <<'PY'
          import json, datetime
          path = "data/daily-activity.json"
          data = json.load(open(path, encoding="utf-8"))
          data["last_successful_utc_date"] = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Commit daily heartbeat
        if: steps.check.outputs.skip == 'false'
        env:
          PROFILE_COMMIT_EMAIL: ${{ secrets.PROFILE_COMMIT_EMAIL }}
        run: |
          git config user.name "hola-mundo999"
          git config user.email "$PROFILE_COMMIT_EMAIL"
          git add data/daily-activity.json
          git commit -m "chore(profile): automated daily activity heartbeat [skip ci]"
          git push origin HEAD:main

      - name: Report already updated
        if: steps.check.outputs.skip == 'true'
        run: echo "Today's UTC heartbeat already exists; no duplicate commit created."
